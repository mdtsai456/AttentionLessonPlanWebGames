<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WedGame · 勇闖迷宮（雙人）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage" aria-label="勇闖迷宮雙人模式">
      <div class="lanes">
        <section class="lane" data-player="p1" aria-label="Player 1">
          <div class="world">
            <div class="scene">
              <div class="bg is-show" data-bg="back"></div>
              <div class="bg" data-bg="near"></div>
              <div class="bg" data-bg="turn-left"></div>
              <div class="bg" data-bg="turn-right"></div>
              <img class="item item-left" alt="" draggable="false" />
              <img class="item item-right" alt="" draggable="false" />
            </div>
          </div>

          <div class="player">
            <img
              class="player-img"
              src="img/player1/playerBack.png"
              alt=""
              draggable="false"
            />
            <div class="player-placeholder is-hidden" aria-hidden="true">
              <div class="ph-hair"></div>
              <div class="ph-body"></div>
              <div class="ph-legs"></div>
            </div>
          </div>

          <div class="hud-score" aria-live="polite">
            <span class="hud-chip hud-chip-gold">P1</span>
            <span class="hud-box score-box">0 分</span>
          </div>

          <p class="prompt">請選擇符合題目的方向</p>
          <p class="feedback" aria-live="assertive"></p>
        </section>

        <section class="lane" data-player="p2" aria-label="Player 2">
          <div class="world">
            <div class="scene">
              <div class="bg is-show" data-bg="back"></div>
              <div class="bg" data-bg="near"></div>
              <div class="bg" data-bg="turn-left"></div>
              <div class="bg" data-bg="turn-right"></div>
              <img class="item item-left" alt="" draggable="false" />
              <img class="item item-right" alt="" draggable="false" />
            </div>
          </div>

          <div class="player">
            <img
              class="player-img"
              src="img/player2/playerBack.png"
              alt=""
              draggable="false"
            />
            <div class="player-placeholder is-hidden" aria-hidden="true">
              <div class="ph-hair"></div>
              <div class="ph-body"></div>
              <div class="ph-legs"></div>
            </div>
          </div>

          <div class="hud-score" aria-live="polite">
            <span class="hud-chip hud-chip-gold">P2</span>
            <span class="hud-box score-box">0 分</span>
          </div>

          <p class="prompt">請選擇符合題目的方向</p>
          <p class="feedback" aria-live="assertive"></p>
        </section>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="hud-timer" aria-live="polite">
        <span class="hud-chip hud-chip-sky">剩餘</span>
        <span class="hud-box" id="timer-box">60 秒</span>
      </div>

      <section class="result is-hidden" id="mid-break" aria-label="第 3 關結束">
        <h1 class="title">挑戰完成！</h1>
        <p class="label">第 3 關已結束<br>要繼續遊玩嗎？</p>
        <div class="btn-row">
          <button type="button" class="btn btn-green" id="mid-continue">繼續遊玩</button>
          <button type="button" class="btn btn-sky" id="mid-lobby">返回大廳</button>
        </div>
      </section>

      <section class="result is-hidden" id="result" aria-label="結算">
        <h1 class="title" id="result-title">闖關結束</h1>
        <p class="result-score" id="result-score-p1">P1：0 / 8 分</p>
        <p class="result-score" id="result-score-p2">P2：0 / 8 分</p>
        <p class="label" id="result-hint">P1 用 A / D，P2 用左右鍵</p>
        <div class="btn-row">
          <button type="button" class="btn btn-green" id="replay-btn">
            再玩一次
          </button>
          <button type="button" class="btn btn-sky" id="back-btn">
            返回選單
          </button>
        </div>
      </section>
    </main>
    <script src="../shared/stage-clear.js"></script>
    <script src="app.js"></script>
  </body>
</html>
