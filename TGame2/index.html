<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attention Lesson Plan - 勇闖迷宮・雙人版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage" aria-label="勇闖迷宮雙人模式">
      <div class="lanes">
        <section class="lane" data-player="p1" aria-label="玩家一">
          <aside class="progress-panel">
            <span class="progress-label">勇闖迷宮</span>
            <div class="progress-track" role="progressbar" aria-label="關卡進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill"></div>
            </div>
          </aside>
          <div class="world">
            <div class="scene">
              <div class="bg is-show" data-bg="back"></div>
              <div class="bg" data-bg="near"></div>
              <div class="bg" data-bg="turn-left"></div>
              <div class="bg" data-bg="turn-right"></div>
              <img class="item item-left" alt="" draggable="false" />
              <img class="item item-right" alt="" draggable="false" />
            </div>
          </div>

          <div class="player">
            <img
              class="player-img"
              src="img/player1/playerBack.png"
              alt=""
              draggable="false"
            />
            <div class="player-placeholder is-hidden" aria-hidden="true">
              <div class="ph-hair"></div>
              <div class="ph-body"></div>
              <div class="ph-legs"></div>
            </div>
          </div>

          <div class="hud-score" aria-live="polite">
            <span class="hud-chip hud-chip-gold">玩家一</span>
            <span class="hud-box score-box">0 分</span>
          </div>

          <p class="round">剩餘 60 秒・按鍵開始（第 1 / 6 關）</p>

          <p class="prompt">請選擇符合題目的方向</p>
          <p class="feedback" aria-live="assertive"></p>
        </section>

        <section class="lane" data-player="p2" aria-label="玩家二">
          <aside class="progress-panel">
            <span class="progress-label">勇闖迷宮</span>
            <div class="progress-track" role="progressbar" aria-label="關卡進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="progress-fill"></div>
            </div>
          </aside>
          <div class="world">
            <div class="scene">
              <div class="bg is-show" data-bg="back"></div>
              <div class="bg" data-bg="near"></div>
              <div class="bg" data-bg="turn-left"></div>
              <div class="bg" data-bg="turn-right"></div>
              <img class="item item-left" alt="" draggable="false" />
              <img class="item item-right" alt="" draggable="false" />
            </div>
          </div>

          <div class="player">
            <img
              class="player-img"
              src="img/player2/playerBack.png"
              alt=""
              draggable="false"
            />
            <div class="player-placeholder is-hidden" aria-hidden="true">
              <div class="ph-hair"></div>
              <div class="ph-body"></div>
              <div class="ph-legs"></div>
            </div>
          </div>

          <div class="hud-score" aria-live="polite">
            <span class="hud-chip hud-chip-gold">玩家二</span>
            <span class="hud-box score-box">0 分</span>
          </div>

          <p class="round">剩餘 60 秒・按鍵開始（第 1 / 6 關）</p>

          <p class="prompt">請選擇符合題目的方向</p>
          <p class="feedback" aria-live="assertive"></p>
        </section>
      </div>

      <div class="divider" aria-hidden="true"></div>
        <button type="button" class="btn btn-sky btn-leave" id="leave-btn">離開</button>
    
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
      <section class="result is-hidden" id="mid-break" aria-label="第 3 關結束">
        <h1 class="title">挑戰完成！</h1>
        <p class="label">第 3 關已結束<br>要繼續遊玩嗎？</p>
        <div class="btn-row">
          <button type="button" class="btn btn-green" id="mid-continue">繼續遊玩</button>
          <button type="button" class="btn btn-sky" id="mid-lobby">返回大廳</button>
        </div>
      </section>

      <section class="result is-hidden" id="result" aria-label="結算">
        <h1 class="title" id="result-title">闖關結束</h1>
        <p class="result-score" id="result-score-p1">玩家一：0 分</p>
        <p class="result-score" id="result-score-p2">玩家二：0 分</p>
        <p class="label" id="result-hint">玩家一用 A / D，玩家二用左右鍵</p>
        <div class="btn-row">
          <button type="button" class="btn btn-green" id="replay-btn">
            再玩一次
          </button>
          <button type="button" class="btn btn-sky" id="back-btn">
            返回選單
          </button>
        </div>
      </section>
    </main>
    <script src="../shared/api.js"></script>
    <script src="../shared/session-timeout.js"></script>
    <script src="../shared/stage-clear.js"></script>
    <script src="../shared/leave-confirm.js"></script>
    <script src="app.js"></script>
  </body>
</html>
