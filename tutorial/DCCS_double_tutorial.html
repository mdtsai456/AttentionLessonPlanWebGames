<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賽道攔截・雙人遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="player-grid">
          <article class="player-card">
            <h2>玩家一（左側）</h2>
            <p>上排：A</p>
            <p>下排：D</p>
          </article>
          <article class="player-card">
            <h2>玩家二（右側）</h2>
            <p>上排：←</p>
            <p>下排：→</p>
          </article>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>物件通過兩排選項時，停在正中間的圖案就是答案。</li>
            <li>答錯不扣分，遊戲也不會重來。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../DCCS/double.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
