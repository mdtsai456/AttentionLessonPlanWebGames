<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賽道攔截・遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="rule-box">
          <h3>怎麼操作</h3>
          <p>上排：← 或 A，每按一下轉一格。</p>
          <p>下排：→ 或 D，每按一下轉一格。</p>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>物件通過兩排選項時，停在正中間的圖案就是答案。</li>
            <li>答錯不扣分，遊戲也不會重來。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../DCCS/index.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
