<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漂浮泡泡・遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="rule-box">
          <h3>怎麼操作</h3>
          <p>點左右按鈕，或按鍵盤 ← →。</p>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>黃色泡泡亮起時，記住它的位置。</li>
            <li>實線箭頭就選那個方向，紅色虛線箭頭要反向選。</li>
            <li>共 6 關，每關 6 題。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../EFT_single/EFT_single.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
