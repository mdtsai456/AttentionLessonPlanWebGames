<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勇闖迷宮・雙人遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="player-grid">
          <article class="player-card">
            <h2>玩家一（左側）</h2>
            <p>向左：A</p>
            <p>向右：D</p>
          </article>
          <article class="player-card">
            <h2>玩家二（右側）</h2>
            <p>向左：←</p>
            <p>向右：→</p>
          </article>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>看題目，選擇符合描述的方向。</li>
            <li>第 3 關結束可以選擇繼續或返回選單。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../TGame2/index.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
