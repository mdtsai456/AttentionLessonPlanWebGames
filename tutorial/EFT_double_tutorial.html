<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漂浮泡泡・雙人遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="player-grid">
          <article class="player-card">
            <h2>玩家一（左側）</h2>
            <p>作答：A 向左、D 向右</p>
          </article>
          <article class="player-card">
            <h2>玩家二（右側）</h2>
            <p>作答：← 向左、→ 向右</p>
          </article>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>黃色泡泡亮起時，記住它的位置。</li>
            <li>實線箭頭就選那個方向，紅色虛線箭頭要反向選。</li>
            <li>共 6 關，每關 6 題。兩人都完成第 3 關後可選擇繼續或返回。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../EFT_double/EFT_double.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
