<!DOCTYPE html>

<head>

  <title>勇闖迷宮・遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="rule-box">
          <h3>怎麼操作</h3>
          <p>向左：A 或 ←</p>
          <p>向右：D 或 →</p>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>看題目，選擇符合描述的方向。</li>
            <li>共 6 關。第 3 關結束可以選擇繼續或返回選單。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../TGame1/index.html">開始遊戲</a>
      </div>
    </section>
  </main>
