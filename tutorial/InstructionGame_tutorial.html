<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指令出擊・遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="rule-box">
          <h3>怎麼操作</h3>
          <p>移動：A / D 或 ← →</p>
          <p>互動：空白鍵或 Enter，也可以直接點門和物品</p>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>依照指示走到門口、拿取物品或把物品放到指定位置。</li>
            <li>第 3 關結束可以選擇繼續或返回選單。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-green" href="../IM1/index.html">開始遊戲</a>
      </div>
    </section>
  </main>
</body>
</html>
