<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動物追擊令・雙人遊戲說明</title>
  <link rel="stylesheet" href="tutorial.css">
</head>
<body>
  <main class="tutorial-container">
    <section class="tutorial-card">
      <div class="header-badge">遊戲說明</div>
      <div class="card-content">
        <div class="player-grid">
          <article class="player-card">
            <h2>玩家一（左側）</h2>
            <p>移動：W / A / S / D</p>
            <p>作答：空白鍵</p>
          </article>
          <article class="player-card">
            <h2>玩家二（右側）</h2>
            <p>移動：方向鍵 ↑ ↓ ← →</p>
            <p>作答：Enter 鍵</p>
          </article>
        </div>
        <div class="rule-box">
          <h3>遊戲規則</h3>
          <ol class="rule-list">
            <li>題目出現後，先移動準心瞄準動物，讓準心與動物重疊。</li>
            <li>正確請按作答鍵；不正確請保持瞄準，不要按鍵。</li>
          </ol>
        </div>
      </div>
      <div class="action-buttons">
        <a class="btn-outline" href="../DAT_double/DAT_double.html?mode=practice">進入練習模式</a>
        <a class="btn-green" href="../DAT_double/DAT_double.html?mode=game">不練習，直接挑戰</a>
      </div>
    </section>
  </main>
</body>
</html>
