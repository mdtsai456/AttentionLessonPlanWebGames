[pytest]
# 本測試套件不可並行執行，不使用 -n／-p xdist。所有測試共用同一個資料庫，
# 每個測試前後皆會清空資料。同時執行兩個 pytest 行程會互相刪除資料。
pythonpath = .
testpaths = tests

# 所有警告皆視為失敗，僅排除 starlette.testclient 對 httpx 的棄用警告。
# 此警告來自第三方套件，排除後可保留專案警告的可見性。
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
