[pytest]
# 這個套件不能並行執行（沒有 -n / -p xdist）。所有測試共用同一個測試資料庫，
# 且每個測試前後都會清空它。同時跑兩個 pytest 行程會互相刪掉對方的資料。
pythonpath = .
testpaths = tests

# 任何警告都算失敗，唯一的例外是 starlette.testclient 對 httpx 的棄用警告。
# 那是第三方套件內部的事，我們無法修，也不該讓它淹沒我們自己的警告。
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient` is deprecated:
