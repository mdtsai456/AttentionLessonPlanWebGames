<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFT 漂浮泡泡・雙人版</title>
  <link rel="stylesheet" href="EFT_double.css">
  <script src="EFT_double.js" defer></script>
</head>
<body>
  <main class="game" aria-label="漂浮泡泡雙人遊戲">
    <section class="player player-1" aria-label="玩家一">
    <aside class="progress-panel">
      <span class="progress-label">漂浮泡泡</span>
      <div class="progress-track" role="progressbar" aria-label="完成題數" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div data-ui="progress-fill"></div></div>
    </aside>
    <header class="score"><span>玩家一</span><strong data-ui="score">0 分</strong></header>
    <div class="round" data-ui="round">第 1 / 20 題</div>
    <div class="bubble-field" data-ui="bubble-field" aria-label="請觀察黃色亮起的目標泡泡"></div>
    <section class="answer-panel" aria-label="作答區">
      <h1>作答</h1>
      <p data-ui="feedback" role="status" aria-live="polite">請看亮起的泡泡</p>
      <p class="keyboard-hint">鍵盤 A / D 或點選按鈕</p>
    </section>
    <button class="direction left" data-direction="left" type="button" aria-label="玩家一向左作答" disabled><span>⬅</span></button>
    <button class="direction right" data-direction="right" type="button" aria-label="玩家一向右作答" disabled><span>➡</span></button>
    <div class="overlay" data-ui="results" hidden>
      <section class="result-card" role="dialog" aria-modal="true" aria-label="玩家一挑戰完成">
        <h2 data-ui="result-title">挑戰完成！</h2><p>你成功完成了這次泡泡冒險</p>
        <strong data-ui="final-score"></strong><p data-ui="accuracy"></p>
        <button class="primary" data-ui="restart" type="button">再玩一次</button>
      </section>
    </div>
    </section>
    <section class="player player-2" aria-label="玩家二">
    <aside class="progress-panel">
      <span class="progress-label">漂浮泡泡</span>
      <div class="progress-track" role="progressbar" aria-label="完成題數" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><div data-ui="progress-fill"></div></div>
    </aside>
    <header class="score"><span>玩家二</span><strong data-ui="score">0 分</strong></header>
    <div class="round" data-ui="round">第 1 / 20 題</div>
    <div class="bubble-field" data-ui="bubble-field" aria-label="請觀察黃色亮起的目標泡泡"></div>
    <section class="answer-panel" aria-label="作答區">
      <h1>作答</h1>
      <p data-ui="feedback" role="status" aria-live="polite">請看亮起的泡泡</p>
      <p class="keyboard-hint">鍵盤 ← / → 或點選按鈕</p>
    </section>
    <button class="direction left" data-direction="left" type="button" aria-label="玩家二向左作答" disabled><span>⬅</span></button>
    <button class="direction right" data-direction="right" type="button" aria-label="玩家二向右作答" disabled><span>➡</span></button>
    <div class="overlay" data-ui="results" hidden>
      <section class="result-card" role="dialog" aria-modal="true" aria-label="玩家二挑戰完成">
        <h2 data-ui="result-title">挑戰完成！</h2><p>你成功完成了這次泡泡冒險</p>
        <strong data-ui="final-score"></strong><p data-ui="accuracy"></p>
        <button class="primary" data-ui="restart" type="button">再玩一次</button>
      </section>
    </div>
    </section>
  </main>
</body>
</html>
