<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WedGame · 選擇遊戲</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" class="btn btn-logout" id="logout-btn">登出</button>
    <main class="stage" id="single-stage">
      <section class="panel" aria-label="選擇遊戲">
        <h1 class="title">選擇遊戲</h1>
        <p class="label">請選擇要遊玩的遊戲</p>

        <div class="game-list" id="game-list"></div>

        <p class="error" id="error-msg" role="alert"></p>
        <button type="button" class="btn btn-enter" id="enter-btn">ENTER</button>
      </section>
    </main>
    <main class="stage stage-dual" id="dual-stage" hidden>
      <section class="panel player-panel" data-player="1" aria-label="玩家 1 選擇遊戲">
        <h1 class="title">玩家 1</h1>
        <p class="label">請選擇要遊玩的遊戲</p>
        <div class="game-list" data-game-list="1"></div>
        <p class="error" data-error="1" role="alert"></p>
        <button type="button" class="btn btn-enter" data-enter="1">ENTER</button>
        <button type="button" class="wait-mask" data-wait="1" hidden>等待玩家二確認</button>
      </section>
      <section class="panel player-panel" data-player="2" aria-label="玩家 2 選擇遊戲">
        <h1 class="title">玩家 2</h1>
        <p class="label">請選擇要遊玩的遊戲</p>
        <div class="game-list" data-game-list="2"></div>
        <p class="error" data-error="2" role="alert"></p>
        <button type="button" class="btn btn-enter" data-enter="2">ENTER</button>
        <button type="button" class="wait-mask" data-wait="2" hidden>等待玩家一確認</button>
      </section>
    </main>
    <script>
      window.API_BASE_URL = "http://127.0.0.1:5001/api";
    </script>
    <script src="../shared/session-timeout.js"></script>
    <script src="../shared/api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
