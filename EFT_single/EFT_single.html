<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EFT 漂浮泡泡・單人版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="EFT_single.css?v=3">
  <script src="../shared/stage-clear.js" defer></script>
  <script src="EFT_single.js" defer></script>
</head>
<body>
  <main class="game" aria-label="漂浮泡泡單人遊戲">
    <aside class="progress-panel">
      <span class="progress-label">漂浮泡泡</span>
      <div class="progress-track" role="progressbar" aria-label="完成題數" aria-valuemin="0" aria-valuemax="36" aria-valuenow="0"><div id="progress-fill"></div></div>
    </aside>
    <header class="score"><span>得分</span><strong id="score">0 分</strong></header>
    <div class="round" id="round">第 1 / 6 題（第 1 / 6 關）</div>
    <div class="bubble-field" id="bubble-field" aria-label="請觀察黃色亮起的目標泡泡"></div>
    <section class="answer-panel" aria-label="作答區">
      <h1>作答</h1>
      <p id="feedback" role="status" aria-live="polite">請看亮起的泡泡</p>
      <p class="keyboard-hint">點選按鈕或按鍵盤 ← →</p>
    </section>
    <button class="direction left" data-direction="left" type="button" aria-label="向左作答" disabled><span>⬅</span></button>
    <button class="direction right" data-direction="right" type="button" aria-label="向右作答" disabled><span>➡</span></button>
    <div class="overlay modal-overlay" id="results" hidden>
      <section class="stage-clear-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
        <div class="stage-title-badge" id="result-title">挑戰完成！</div>
        <p class="stage-clear-text" id="final-score"></p>
        <p class="result-detail" id="accuracy"></p>
        <div class="stage-clear-actions">
          <button id="restart" class="btn-continue" type="button">再玩一次</button>
          <button id="btn-lobby-finish" class="btn-lobby" type="button">返回遊戲大廳</button>
        </div>
      </section>
    </div>
    <div id="mid-break-modal" class="modal-overlay" hidden>
      <div class="stage-clear-card">
        <div class="stage-title-badge">挑戰完成！</div>
        <p class="stage-clear-text">第 3 關已結束<br>要繼續遊玩嗎？</p>
        <div class="stage-clear-actions">
          <button id="btn-continue" class="btn-continue" type="button">繼續遊玩</button>
          <button id="btn-lobby" class="btn-lobby" type="button">返回遊戲大廳</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
